<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth" data-theme="forest-amber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Page Not Found · Timber &amp; Tonic — Certified Arborist &amp; Tree Care</title>

    <link rel="icon" type="image/svg+xml" href="Assets/favicon.svg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'forest': 'rgba(var(--color-rgb-primary), <alpha-value>)',
                        'forest-light': 'rgba(var(--color-rgb-light), <alpha-value>)',
                        'forest-dark': 'rgba(var(--color-rgb-dark), <alpha-value>)',
                        'forest-bright': 'rgba(var(--color-rgb-bright), <alpha-value>)',
                        'amber-brand': 'rgba(var(--color-rgb-accent), <alpha-value>)',
                        'bg-warm': 'var(--color-bg-warm)',
                        'neutral-dark': 'rgba(45, 43, 38, <alpha-value>)',
                        'neutral-light': '#EBF2EC',
                        'dark-bg': '#131d11',
                        'dark-card': '#1e2b1c',
                        'dark-surface': '#2a3b27',
                    },
                    fontFamily: {
                        'sans': ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        'serif': ['Playfair Display', 'Georgia', 'serif'],
                        'display': ['Barlow Condensed', 'Impact', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'float-slow': 'floatSlow 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'sway': 'sway 8s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        floatSlow: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        sway: { '0%,100%': { transform: 'rotate(-2deg)' }, '50%': { transform: 'rotate(2deg)' } },
                    }
                }
            }
        };
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        if (localStorage.getItem('dir') === 'rtl') { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar'; }
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root, [data-theme="forest-amber"] {
            --color-primary: #1e2b1c;
            --color-primary-light: #3a5a35;
            --color-primary-dark: #131d11;
            --color-primary-bright: #7a8f6b;
            --color-accent: #c97f2e;
            --color-bg-warm: #f3efe6;
            --color-text-dark: #2d2b26;
            --color-rgb-primary: 30, 43, 28;
            --color-rgb-light: 58, 90, 53;
            --color-rgb-dark: 19, 29, 17;
            --color-rgb-bright: 122, 143, 107;
            --color-rgb-accent: 201, 127, 46;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-bg-warm);
            color: var(--color-text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Inter', system-ui, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .dark body {
            background-color: #131d11;
            color: #e2ddd5;
        }

        .dark .text-neutral-dark { color: #e2ddd5; }

        .amber-gradient-text {
            background: linear-gradient(135deg, #e89b3e 0%, var(--color-accent) 50%, #a8542c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .forest-gradient-text {
            background: linear-gradient(135deg, var(--color-primary-bright) 0%, var(--color-primary-light) 50%, var(--color-primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Theme toggles — top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }

        .toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--color-rgb-primary), 0.08);
            color: var(--color-primary);
            transition: all 0.3s ease;
            border: 1px solid rgba(var(--color-rgb-primary), 0.18);
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .dark .toggle-btn {
            background: rgba(var(--color-rgb-bright), 0.12);
            color: var(--color-primary-bright);
            border-color: rgba(var(--color-rgb-bright), 0.2);
        }

        .toggle-btn:hover {
            transform: scale(1.08);
            background: var(--color-accent);
            color: #ffffff;
            border-color: var(--color-accent);
        }

        .dark .toggle-btn:hover {
            background: var(--color-accent);
            color: #131d11;
        }

        /* 404 Card */
        .error-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 2.5rem 2.2rem 2.2rem;
            box-shadow: 0 25px 50px rgba(var(--color-rgb-primary), 0.10);
            border: 1px solid #e2d9cb;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            text-align: center;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .dark .error-card {
            background: #1e2b1c;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
        }

        .brand-logo {
            background: var(--color-accent);
            width: 46px;
            height: 46px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-accent), 0.25);
            transition: all 0.3s ease;
            overflow: hidden;
            font-size: 1.3rem;
        }

        .brand-logo:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .brand-logo i {
            color: #ffffff;
        }

        .dark .brand-logo i {
            color: #131d11;
        }

        /* Big 404 number */
        .error-code {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            margin: 0.5rem 0 0.25rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--color-primary-bright) 0%, var(--color-accent) 50%, #a8542c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--color-text-dark);
            margin-top: 0.25rem;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .dark .error-title {
            color: #e2ddd5;
        }

        .error-subtitle {
            font-size: 0.88rem;
            color: var(--color-text-dark);
            text-align: center;
            margin-bottom: 0.75rem;
            font-weight: 400;
            opacity: 0.7;
            line-height: 1.5;
        }

        .dark .error-subtitle {
            color: #e2ddd5;
        }

        /* Flourish divider */
        .flourish-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.75rem 0 0.25rem;
            color: var(--color-accent);
            opacity: 0.7;
        }

        .flourish-divider .line {
            width: 32px;
            height: 1px;
            background: currentColor;
        }

        .flourish-divider i {
            font-size: 0.6rem;
        }

        /* Primary button — identical to login */
        .btn-timber {
            background: var(--color-accent);
            color: #ffffff;
            font-weight: 700;
            padding: 0.85rem 1.8rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-accent), 0.3);
            text-decoration: none;
            gap: 0.5rem;
        }

        .dark .btn-timber {
            background: var(--color-accent);
            color: #131d11;
            box-shadow: 0 4px 15px rgba(var(--color-rgb-accent), 0.3);
        }

        .btn-timber:hover {
            transform: translateY(-2px);
            background: #e89b3e;
            box-shadow: 0 10px 25px rgba(var(--color-rgb-accent), 0.4);
            color: #ffffff;
        }

        .dark .btn-timber:hover {
            color: #131d11;
        }

        /* Secondary link button */
        .btn-ghost {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.8rem;
            border-radius: 8px;
            border: 1.5px solid #d6cfc2;
            background: #fdfbf7;
            color: var(--color-text-dark);
            font-weight: 600;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            cursor: pointer;
            text-decoration: none;
            gap: 0.5rem;
        }

        .dark .btn-ghost {
            background: #131d11;
            border-color: rgba(var(--color-rgb-bright), 0.2);
            color: #e2ddd5;
        }

        .btn-ghost:hover {
            background: var(--color-bg-warm);
            border-color: var(--color-accent);
            transform: translateY(-2px);
            color: var(--color-text-dark);
        }

        .dark .btn-ghost:hover {
            background: rgba(var(--color-rgb-bright), 0.08);
            border-color: var(--color-accent);
            color: #e2ddd5;
        }

        .btn-ghost i {
            color: var(--color-primary-light);
            font-size: 0.9rem;
        }

        .dark .btn-ghost i {
            color: var(--color-primary-bright);
        }

        /* Decorative tree icon */
        .error-icon-wrap {
            display: flex;
            justify-content: center;
            margin: 0.5rem 0 0.25rem;
        }

        .error-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(var(--color-rgb-accent), 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-accent);
            font-size: 1.6rem;
            animation: sway 8s ease-in-out infinite;
        }

        .dark .error-icon {
            background: rgba(var(--color-rgb-accent), 0.15);
            color: #e89b3e;
        }

        /* Background glow — identical to login */
        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-primary), 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow {
            background: radial-gradient(circle, rgba(var(--color-rgb-bright), 0.05) 0%, transparent 70%);
        }

        .bg-glow-left {
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(var(--color-rgb-accent), 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dark .bg-glow-left {
            background: radial-gradient(circle, rgba(var(--color-rgb-accent), 0.04) 0%, transparent 70%);
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        /* Responsive — matches login breakpoints */
        @media (max-height: 700px) {
            .error-card { padding: 1.2rem 1.5rem 1.2rem; transform: scale(0.94); transform-origin: center; }
            .logo-center { margin-bottom: 0.4rem; }
            .error-code { font-size: 4.5rem; margin: 0.25rem 0 0.1rem; }
            .error-title { font-size: 1.3rem; }
            .error-subtitle { font-size: 0.78rem; margin-bottom: 0.5rem; }
            .btn-timber { padding: 0.6rem 1.2rem; font-size: 0.82rem; }
            .btn-ghost { padding: 0.55rem 1.2rem; font-size: 0.78rem; }
            .brand-logo { width: 36px; height: 36px; font-size: 1rem; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.8rem; }
            .flourish-divider { margin: 0.4rem 0 0; }
            .error-icon { width: 48px; height: 48px; font-size: 1.2rem; }
        }

        @media (max-width: 380px) {
            .error-card { padding: 1.5rem 1.2rem; border-radius: 10px; }
            .error-code { font-size: 4rem; }
            .error-title { font-size: 1.25rem; }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper { top: 12px; right: 12px; }
            [dir="rtl"] .theme-toggle-wrapper { left: 12px; right: auto; }
        }

        a {
            transition: all 0.2s ease;
        }
    </style>
</head>

<body>

    <!-- Background Glows -->
    <div class="bg-glow"></div>
    <div class="bg-glow-left"></div>

    <!-- ===== THEME TOGGLES ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">⇄</button>
    </div>

    <!-- ===== 404 CARD ===== -->
    <div class="container-tight relative z-10">
        <div class="error-card animate-fade-in">

            <!-- LOGO -->
            <div class="logo-center">
                <a href="index.html" class="flex items-center gap-3 group shrink-0" dir="ltr">
                    <div class="brand-logo group-hover:rotate-6 transition duration-300">
                        <i class="fas fa-tree"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-serif font-bold tracking-wide text-neutral-dark dark:text-white">
                            Timber <span class="amber-gradient-text">&amp; Tonic</span>
                        </span>
                    </div>
                </a>
            </div>

            <!-- ERROR ICON -->
            <div class="error-icon-wrap">
                <div class="error-icon">
                    <i class="fas fa-tree"></i>
                </div>
            </div>

            <!-- 404 CODE -->
            <div class="error-code">404</div>

            <h1 class="error-title">Lost in the Woods</h1>

            <div class="flourish-divider">
                <span class="line"></span>
                <i class="fas fa-leaf"></i>
                <span class="line"></span>
            </div>

            <p class="error-subtitle">
                The page you're looking for has been uprooted or never existed.
                Let's get you back on solid ground.
            </p>

            <!-- ACTION BUTTONS -->
            <div class="space-y-3 mt-5">
                <a href="index.html" class="btn-timber">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="login.html" class="btn-ghost">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </a>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Toggle
            const themeBtn = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                document.documentElement.classList.toggle('dark', isDark);
                document.documentElement.setAttribute('data-theme', 'forest-amber');
                const moon = themeBtn?.querySelector('.fa-moon');
                const sun = themeBtn?.querySelector('.fa-sun');
                if (isDark) { moon?.classList.add('hidden'); sun?.classList.remove('hidden'); }
                else { moon?.classList.remove('hidden'); sun?.classList.add('hidden'); }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            themeBtn?.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark')));
            setTheme(localStorage.getItem('theme') === 'dark');

            // RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
                document.documentElement.setAttribute('lang', isRTL ? 'ar' : 'en');
                localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
            }

            setRTL(localStorage.getItem('dir') === 'rtl');
            rtlBtn?.addEventListener('click', () => setRTL(document.documentElement.getAttribute('dir') !== 'rtl'));
        });
    </script>

</body>
</html>
